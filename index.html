<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Social proof section</title>
  </head>
  <body>
    <main class="social-proof-section">
      <h1 class="heading-primary">10,000+ of our users love our products.</h1>
      <p class="social-proof-description">
        We only provide great products combined with excellent customer service.
        See what our satisfied customers are saying about our services.
      </p>

      <div class="social-proof-ratings">
        <div class="social-proof-rating">
          <div class="rating-stars">
            <img src="images/icon-star.svg" alt="A star icon" />
            <img src="images/icon-star.svg" alt="A star icon" />
            <img src="images/icon-star.svg" alt="A star icon" />
            <img src="images/icon-star.svg" alt="A star icon" />
            <img src="images/icon-star.svg" alt="A star icon" />
          </div>
          <div class="rating-text">Rated 5 Stars in Reviews</div>
        </div>

        <div class="social-proof-rating">
          <div class="rating-stars">
            <img src="images/icon-star.svg" alt="A star icon" />
            <img src="images/icon-star.svg" alt="A star icon" />
            <img src="images/icon-star.svg" alt="A star icon" />
            <img src="images/icon-star.svg" alt="A star icon" />
            <img src="images/icon-star.svg" alt="A star icon" />
          </div>
          <div class="rating-text">Rated 5 Stars in Report Guru</div>
        </div>

        <div class="social-proof-rating">
          <div class="rating-stars">
            <img src="images/icon-star.svg" alt="A star icon" />
            <img src="images/icon-star.svg" alt="A star icon" />
            <img src="images/icon-star.svg" alt="A star icon" />
            <img src="images/icon-star.svg" alt="A star icon" />
            <img src="images/icon-star.svg" alt="A star icon" />
          </div>
          <div class="rating-text">Rated 5 Stars in BestTech</div>
        </div>
      </div>

      <figure class="social-proof-testimonial">
        <img
          src="images/image-colton.jpg"
          alt="A profile picture of Colton Smith"
        />
        <p class="testimonial-name">Colton Smith</p>
        <p class="status">Verified Buyer</p>

        <blockquote class="testimonial-text">
          "We needed the same printed design as the one we had ordered a week
          prior. Not only did they find the original order, but we also received
          it in time. Excellent!"
        </blockquote>
      </figure>

      <figure class="social-proof-testimonial">
        <img
          src="images/image-irene.jpg"
          alt="A profile picture of Irene Roberts"
        />
        <p class="testimonial-name">Irene Roberts</p>
        <p class="status">Verified Buyer</p>

        <blockquote class="testimonial-text">
          "Customer service is always excellent and very quick turn around.
          Completely delighted with the simplicity of the purchase and the speed
          of delivery."
        </blockquote>
      </figure>

      <figure class="social-proof-testimonial">
        <img
          src="images/image-anne.jpg"
          alt="A profile picture of Anne Wallace"
        />
        <p class="testimonial-name">Anne Wallace</p>
        <p class="status">Verified Buyer</p>

        <blockquote class="testimonial-text">
          "Put an order with this company and can only praise them for the very
          high standard. Will definitely use them again and recommend them to
          everyone!"
        </blockquote>
      </figure>
    </main>
  </body>
</html>
