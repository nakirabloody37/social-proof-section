<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Social proof section</title>
  </head>
  <body>
    <main class="social-proof-section">
      <div class="heading">
        <h1 class="heading-primary">10,000+ of our users love our products.</h1>
        <p class="social-proof-description">
          We only provide great products combined with excellent customer
          service. See what our satisfied customers are saying about our
          services.
        </p>
      </div>

      <div class="social-proof-ratings">
        <div class="social-proof-rating">
          <div class="rating-stars">
            <img
              class="star-icon"
              src="images/icon-star.svg"
              alt="A star icon"
            />
            <img
              class="star-icon"
              src="images/icon-star.svg"
              alt="A star icon"
            />
            <img
              class="star-icon"
              src="images/icon-star.svg"
              alt="A star icon"
            />
            <img
              class="star-icon"
              src="images/icon-star.svg"
              alt="A star icon"
            />
            <img
              class="star-icon"
              src="images/icon-star.svg"
              alt="A star icon"
            />
          </div>
          <div class="rating-text">Rated 5 Stars in Reviews</div>
        </div>

        <div class="social-proof-rating">
          <div class="rating-stars">
            <img
              class="star-icon"
              src="images/icon-star.svg"
              alt="A star icon"
            />
            <img
              class="star-icon"
              src="images/icon-star.svg"
              alt="A star icon"
            />
            <img
              class="star-icon"
              src="images/icon-star.svg"
              alt="A star icon"
            />
            <img
              class="star-icon"
              src="images/icon-star.svg"
              alt="A star icon"
            />
            <img
              class="star-icon"
              src="images/icon-star.svg"
              alt="A star icon"
            />
          </div>
          <div class="rating-text">Rated 5 Stars in Report Guru</div>
        </div>

        <div class="social-proof-rating">
          <div class="rating-stars">
            <img
              class="star-icon"
              src="images/icon-star.svg"
              alt="A star icon"
            />
            <img
              class="star-icon"
              src="images/icon-star.svg"
              alt="A star icon"
            />
            <img
              class="star-icon"
              src="images/icon-star.svg"
              alt="A star icon"
            />
            <img
              class="star-icon"
              src="images/icon-star.svg"
              alt="A star icon"
            />
            <img
              class="star-icon"
              src="images/icon-star.svg"
              alt="A star icon"
            />
          </div>
          <div class="rating-text rating-text--best-tech">
            Rated 5 Stars in BestTech
          </div>
        </div>
      </div>

      <div class="social-proof-testimonials">
        <figure class="social-proof-testimonial">
          <div class="testimonial-author">
            <img
              class="testimonial-img"
              src="images/image-colton.jpg"
              alt="A profile picture of Colton Smith"
            />
            <div class="testimonial-author-text">
              <p class="testimonial-name">Colton Smith</p>
              <p class="testimonial-author-status">Verified Buyer</p>
            </div>
          </div>

          <blockquote class="testimonial-text">
            "We needed the same printed design as the one we had ordered a week
            prior. Not only did they find the original order, but we also
            received it in time. Excellent!"
          </blockquote>
        </figure>

        <figure class="social-proof-testimonial">
          <div class="testimonial-author">
            <img
              class="testimonial-img"
              src="images/image-irene.jpg"
              alt="A profile picture of Irene Roberts"
            />
            <div class="testimonial-author-text">
              <p class="testimonial-name">Irene Roberts</p>
              <p class="testimonial-author-status">Verified Buyer</p>
            </div>
          </div>

          <blockquote class="testimonial-text">
            "Customer service is always excellent and very quick turn around.
            Completely delighted with the simplicity of the purchase and the
            speed of delivery."
          </blockquote>
        </figure>

        <figure class="social-proof-testimonial">
          <div class="testimonial-author">
            <img
              class="testimonial-img"
              src="images/image-anne.jpg"
              alt="A profile picture of Anne Wallace"
            />
            <div class="testimonial-author-text">
              <p class="testimonial-name">Anne Wallace</p>
              <p class="testimonial-author-status">Verified Buyer</p>
            </div>
          </div>

          <blockquote class="testimonial-text">
            "Put an order with this company and can only praise them for the
            very high standard. Will definitely use them again and recommend
            them to everyone!"
          </blockquote>
        </figure>
      </div>
    </main>
  </body>
</html>
